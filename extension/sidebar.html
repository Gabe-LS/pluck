<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="prism-devtools.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
}

body {
  font: 11px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  padding: 8px;
  color: #333;
  background: #fff;
  display: flex;
  flex-direction: column;
}

body.dark {
  color: #e8eaed;
  background: #292a2d;
}

.first-line {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 4px;
}

.first-line-left {
  min-width: 0;
}

#no-selection {
  color: #666;
  padding: 8px 0;
}
body.dark #no-selection { color: #9aa0a6; }

#element-info {
  display: none;
  flex: 1;
  min-height: 0;
  flex-direction: column;
}

.element-label {
  font-family: "SF Mono", "Menlo", "Monaco", "Consolas", monospace;
  font-size: 11px;
  word-break: break-all;
}

.element-label .tag { color: #881280; }
.element-label .id { color: #1a1aa6; }
.element-label .cls { color: #994500; }
body.dark .element-label .tag { color: #d5a5ff; }
body.dark .element-label .id { color: #7cacf8; }
body.dark .element-label .cls { color: #f8c37a; }

.stats {
  color: #666;
  font-size: 10px;
  margin-bottom: 8px;
}
body.dark .stats { color: #9aa0a6; }

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 8px;
}

button {
  font: inherit;
  font-size: 11px;
  padding: 4px 12px;
  border: 1px solid #ddd;
  border-radius: 3px;
  cursor: pointer;
  background: #1a73e8;
  color: #fff;
  border: none;
  transition: background 0.3s ease;
  flex: 1 0 180px;
  white-space: nowrap;
}
body.dark button {
  background: #8ab4f8;
  color: #202124;
}

button:hover { background: #1557b0; }
body.dark button:hover { background: #aecbfa; }


button { position: relative; overflow: hidden; }
button .btn-label { transition: opacity 0.3s ease; }
button .btn-ok {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  opacity: 0;
  transition: opacity 0.3s ease;
  pointer-events: none;
}
button.success { background: #0d9 !important; color: #fff !important; }
button.success .btn-label { opacity: 0; }
button.success .btn-ok { opacity: 1; }
body.dark button.success { background: #0b7 !important; }

.preview {
  border: 1px solid #ddd;
  border-radius: 3px;
  flex: 1;
  min-height: 0;
  overflow: hidden;
}
body.dark .preview {
  border-color: #3c4043;
}

.preview pre {
  margin: 0 !important;
  padding: 6px 8px !important;
  font-size: 10px !important;
  line-height: 1.4 !important;
  border-radius: 3px !important;
  height: 100% !important;
  overflow: auto !important;
}

.wl {
  display: block;
}

body.dark .preview pre[class*="language-"] {
  background: #202124 !important;
}

.options {
  margin-bottom: 8px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.options label {
  font-size: 10px;
  color: #666;
  display: flex;
  align-items: center;
  gap: 3px;
  cursor: pointer;
}
body.dark .options label { color: #9aa0a6; }

.options input[type="checkbox"] {
  margin: 0;
}

.hint {
  font-size: 9px;
  color: #999;
  margin-bottom: 8px;
}
body.dark .hint { color: #9aa0a6; }

.preview-sub {
  visibility: hidden;
}

.preview.rendered {
  padding: 10px;
  font: 12px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  color: #1f2328;
  background: #fff;
  overflow: auto;
}
body.dark .preview.rendered {
  color: #e6edf3;
  background: #292a2d;
}

.preview.rendered > :first-child { margin-top: 0; }
.preview.rendered > :last-child { margin-bottom: 0; }

.preview.rendered h1 { font-size: 16px; font-weight: 600; margin: 14px 0 6px; padding-bottom: 4px; border-bottom: 1px solid #d1d9e0; }
.preview.rendered h2 { font-size: 14px; font-weight: 600; margin: 12px 0 5px; padding-bottom: 3px; border-bottom: 1px solid #d1d9e0; }
.preview.rendered h3 { font-size: 12px; font-weight: 600; margin: 10px 0 4px; }
.preview.rendered h4 { font-size: 11px; font-weight: 600; margin: 8px 0 4px; }
body.dark .preview.rendered h1,
body.dark .preview.rendered h2 { border-bottom-color: #3c4043; }

.preview.rendered p { margin: 6px 0; }

.preview.rendered ul, .preview.rendered ol { padding-left: 18px; margin: 6px 0; }
.preview.rendered li { margin: 2px 0; }
.preview.rendered li > ul, .preview.rendered li > ol { margin: 2px 0; }

.preview.rendered a { color: #0969da; text-decoration: none; }
.preview.rendered a:hover { text-decoration: underline; }
body.dark .preview.rendered a { color: #58a6ff; }

.preview.rendered strong { font-weight: 600; }
.preview.rendered em { font-style: italic; }

.preview.rendered code {
  font: 11px/1.4 "SF Mono", "Menlo", "Monaco", "Consolas", monospace;
  background: rgba(175,184,193,0.2);
  padding: 1px 5px;
  border-radius: 4px;
}
body.dark .preview.rendered code { background: rgba(110,118,129,0.4); }

.preview.rendered pre {
  background: #f6f8fa;
  border-radius: 4px;
  padding: 8px;
  overflow-x: auto;
  margin: 6px 0;
}
.preview.rendered pre code { background: none; padding: 0; border-radius: 0; }
body.dark .preview.rendered pre { background: #161b22; }

.preview.rendered blockquote {
  margin: 6px 0;
  padding: 2px 10px;
  border-left: 3px solid #d1d9e0;
  color: #656d76;
}
body.dark .preview.rendered blockquote { border-left-color: #3c4043; color: #8b949e; }

.preview.rendered hr { border: none; border-top: 1px solid #d1d9e0; margin: 10px 0; height: 0; }
body.dark .preview.rendered hr { border-top-color: #3c4043; }

.preview.rendered table { border-collapse: collapse; margin: 6px 0; width: 100%; }
.preview.rendered th, .preview.rendered td { border: 1px solid #d1d9e0; padding: 4px 8px; font-size: 11px; text-align: left; }
.preview.rendered th { font-weight: 600; background: #f6f8fa; }
body.dark .preview.rendered th, body.dark .preview.rendered td { border-color: #3c4043; }
body.dark .preview.rendered th { background: #161b22; }

.preview.rendered img { max-width: 100%; }
.preview.rendered del { text-decoration: line-through; }

.options select {
  font: inherit;
  font-size: 10px;
  padding: 0 2px;
  border: 1px solid #ccc;
  border-radius: 2px;
  background: #fff;
  color: #333;
  outline: none;
}
body.dark .options select {
  background: #3c4043;
  color: #e8eaed;
  border-color: #5f6368;
}
</style>
</head>
<body>

<div class="first-line">
  <div class="first-line-left">
    <div id="no-selection">Select an element in the Elements panel</div>
    <div class="element-label" id="element-label"></div>
  </div>
</div>

<div id="element-info">
  <div class="options">
    <label><input type="checkbox" id="opt-children" checked> Include children</label>
    <label><input type="checkbox" id="opt-dimensions"> Include width/height</label>
    <label><input type="checkbox" id="opt-highlight"> Highlight</label>
  </div>
  <div class="options">
    <label><input type="checkbox" id="opt-preview"> Preview</label>
    <select id="opt-preview-mode" class="preview-sub"><option value="html">HTML code</option><option value="md">MD code</option><option value="md-rendered">MD rendered</option></select>
    <label id="wrap-label" class="preview-sub"><input type="checkbox" id="opt-wrap"> Soft wrap</label>
  </div>
  <div class="actions">
    <button id="btn-copy"><span class="btn-label">Copy as HTML + inline CSS</span><span class="btn-ok">Copied!</span></button>
    <button id="btn-copy-md"><span class="btn-label">Copy as Markdown (MD)</span><span class="btn-ok">Copied!</span></button>
  </div>
  <div class="hint">Hold Alt to download instead of copy</div>
  <div class="preview" id="preview" style="display:none"></div>
</div>

<script src="prism.js"></script>
<script src="prism-markdown.js"></script>
<script src="turndown.js"></script>
<script src="marked.js"></script>
<script src="extractor.js"></script>
<script src="sidebar.js"></script>
</body>
</html>
